<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle Dev Tools Playground</title><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<style>
body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,sans-serif}a{color:#93c5fd;text-decoration:none}.w{max-width:1180px;margin:auto;padding:28px 22px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#aab4d6}h1{font-size:38px;margin:18px 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.p{background:#121933;border:1px solid #2b355d;border-radius:14px;padding:16px}.bar{display:grid;grid-template-columns:2fr 1fr auto auto;gap:10px;align-items:end;margin:14px 0}.btn{padding:10px 14px;border-radius:9px;border:1px solid #2b355d;background:#eef2ff;color:#0b1020;font-weight:700;cursor:pointer}select,input,textarea{width:100%;background:#080d1b;color:#eef2ff;border:1px solid #34406c;border-radius:9px;padding:11px;font:14px/1.5 monospace}textarea{min-height:310px;resize:vertical}pre{white-space:pre-wrap;min-height:310px;background:#080d1b;border:1px solid #263157;border-radius:9px;padding:12px;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hide{display:none}.label{display:block;color:#aab4d6;font-size:12px;margin-bottom:5px}@media(max-width:800px){.grid,.row,.bar{grid-template-columns:1fr}}
</style></head><body><div class="w">
<div class="top"><a href="./">← Oracle Dev Tools</a><span class="muted">Runs locally in your browser · no backend</span></div>
<h1 id="title">Oracle Dev Tool</h1><p class="muted" id="desc"></p>
<div class="bar"><div><label class="label">Tool</label><select id="tool"></select></div><div><label class="label">Sample</label><select id="sampleLevel"></select></div><button class="btn" id="sample">Load sample</button><button class="btn" id="run">Run</button></div>
<div class="row"><div id="targetWrap" class="hide"><label class="label">Migration target</label><select id="target"><option value="postgres">PostgreSQL</option><option value="sqlserver">SQL Server</option></select></div><div id="tableWrap" class="hide"><label class="label">Target table</label><input id="tableName" value="STG_DATA"></div></div>
<div class="grid"><section class="p"><h2>Input</h2><textarea id="input"></textarea><label id="secondLabel" class="label hide">After SQL</label><textarea id="input2" class="hide"></textarea></section><section class="p"><h2>Output</h2><pre id="output"></pre></section></div>
<p class="muted">Samples: Simple, Intermediate and Complex. The browser version is a lightweight interactive implementation; each GitHub repository remains the reference CLI/package implementation.</p>
</div><script src="playground.js"></script></body></html>
